<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Table with Rowspan and Colspan</title>
</head>
<body>
  <h1>Example Table with Rowspan and Colspan</h2>
  
  <table border="1">
    <tr>
      <th rowspan="3">S.No</th>
      <th colspan="2">Name</th>
      <th rowspan="2">Country</th>
    </tr>
    <tr>
      <th>First Name</th>
      <th>Last Name</th>
    </tr>
    <tr>
      <td>1</td>
      <td>John</td>
      <td> row Doe</td>
      <td>USA</td>
      

    </tr>
    <tr>
      <td>2</td>
      <td>Jane</td>
      <td>Smith</td>
      <td>UK</td>
      <td>USA</td>
    </tr>
    <tr>
      <td>3</td>
      <td>Ali</td>
      <td>Khan</td>
      <td>Pakistan</td>
      <td>USA</td>
    </tr>
  </table>
</body>
</html>
