<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="postioning2.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="form-container">
      <h2>Registration Form</h2>
      <form>
        <div class="input-group">
          <i class="fa fa-envelope"></i>
          <input type="email" placeholder="Email" required />
        </div>

        <div class="input-group">
          <i class="fa fa-lock"></i>
          <input type="password" placeholder="Password" required />
        </div>

        <div class="input-group">
          <i class="fa fa-lock"></i>
          <input type="password" placeholder="Re-type Password" required />
        </div>

        <div class="name-box">
          <div class="input-group">
            <i class="fa fa-user"></i>
            <input type="text" placeholder="First Name" required />
          </div>
          <div class="input-group">
            <i class="fa fa-user"></i>
            <input type="text" placeholder="Last Name" required />
          </div>
        </div>

        <div class="gender">
          <label><input type="radio" name="gender" value="male" /> Male</label>
          <label
            ><input type="radio" name="gender" value="female" /> Female</label
          >
        </div>

        <select required>
          <option value="">Select a country</option>
          <option>Pakistan</option>
          <option>India</option>
          <option>USA</option>
          <option>UK</option>
        </select>

        <label
          ><input type="checkbox" /> I agree with terms and conditions</label
        >
        <label
          ><input type="checkbox" /> I want to receive the newsletter</label
        >

        <button type="submit">Register</button>
      </form>
    </div>

    <footer>DEVELOPED BY <span>ARSAL NAEEM RAMAY</span></footer>
  </body>
</html>
